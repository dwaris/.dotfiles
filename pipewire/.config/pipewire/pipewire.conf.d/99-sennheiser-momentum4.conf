context.modules = [
    {
        name  = libpipewire-module-filter-chain
        flags = [ nofail ]
        args  = {
            node.description = "Sennheiser Momentum 4 (EQ)"
            media.name       = "Sennheiser Momentum 4 (EQ)"
            filter.graph     = {
                nodes = [
                    {
                        type    = builtin
                        name    = preamp
                        label   = linear
                        control = { "Mult" = 0.3396 } # -9.38 dB
                    }
                    { type = builtin name = f1  label = bq_lowshelf  control = { "Freq" = 105.0   "Q" = 0.70 "Gain" = -2.0  } }
                    { type = builtin name = f2  label = bq_peaking   control = { "Freq" = 65.2    "Q" = 3.05 "Gain" = 2.4   } }
                    { type = builtin name = f3  label = bq_peaking   control = { "Freq" = 126.3   "Q" = 1.08 "Gain" = -4.0  } }
                    { type = builtin name = f4  label = bq_peaking   control = { "Freq" = 968.1   "Q" = 1.41 "Gain" = -12.5 } }
                    { type = builtin name = f5  label = bq_peaking   control = { "Freq" = 1789.1  "Q" = 2.42 "Gain" = 2.7   } }
                    { type = builtin name = f6  label = bq_peaking   control = { "Freq" = 2260.1  "Q" = 1.45 "Gain" = 9.4   } }
                    { type = builtin name = f7  label = bq_peaking   control = { "Freq" = 3978.2  "Q" = 6.00 "Gain" = -4.5  } }
                    { type = builtin name = f8  label = bq_peaking   control = { "Freq" = 5567.3  "Q" = 1.66 "Gain" = 8.0   } }
                    { type = builtin name = f9  label = bq_peaking   control = { "Freq" = 8755.5  "Q" = 2.18 "Gain" = 1.7   } }
                    { type = builtin name = f10 label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.70 "Gain" = 2.2   } }
                ]
                links = [
                    { output = "preamp:Out" input = "f1:In"  }
                    { output = "f1:Out"     input = "f2:In"  }
                    { output = "f2:Out"     input = "f3:In"  }
                    { output = "f3:Out"     input = "f4:In"  }
                    { output = "f4:Out"     input = "f5:In"  }
                    { output = "f5:Out"     input = "f6:In"  }
                    { output = "f6:Out"     input = "f7:In"  }
                    { output = "f7:Out"     input = "f8:In"  }
                    { output = "f8:Out"     input = "f9:In"  }
                    { output = "f9:Out"     input = "f10:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props  = {
                node.name        = "effect_input.sennheiser_momentum_4"
                media.class      = "Audio/Sink"
                priority.driver  = 1009
                priority.session = 1009
            }
            playback.props = {
                node.name           = "effect_output.sennheiser_momentum_4"
                node.passive        = true
                node.dont-reconnect = true
                target.object       = "alsa_output.usb-Focusrite_Scarlett_Solo_4th_Gen_S1CCK5M3C2A75F-00.HiFi__Line1__sink"
            }
        }
    }
]
