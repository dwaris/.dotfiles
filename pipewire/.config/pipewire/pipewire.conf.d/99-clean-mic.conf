context.modules = [
    {
        name  = libpipewire-module-filter-chain
        flags = [ nofail ]
        args  = {
            node.description = "Clean Microphone"
            media.name       = "Clean Microphone"
            filter.graph     = {
                nodes = [
                    {
                        type    = builtin
                        name    = preamp
                        label   = linear
                        control = { "Mult" = 0.7943 } # -2.0 dB headroom for EQ boosts
                    }
                    {
                        type    = builtin
                        name    = hpf
                        label   = bq_highpass
                        control = {
                            "Freq" = 80.0
                            "Q"    = 0.707
                        }
                    }
                    {
                        type    = ladspa
                        name    = rnnoise
                        plugin  = librnnoise_ladspa
                        label   = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"          = 70.0
                            "VAD Grace Period (ms)"      = 300
                            "Retroactive VAD Grace (ms)" = 100
                        }
                    }
                    { type = builtin name = eq_box     label = bq_peaking   control = { "Freq" = 220.0   "Q" = 0.7 "Gain" = -2.0 } }
                    { type = builtin name = eq_mud     label = bq_peaking   control = { "Freq" = 350.0   "Q" = 1.2 "Gain" = -2.0 } }
                    { type = builtin name = eq_clarity label = bq_peaking   control = { "Freq" = 3500.0  "Q" = 0.9 "Gain" = 2.0  } }
                    { type = builtin name = eq_air     label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.7 "Gain" = 2.0  } }
                ]
                links = [
                    { output = "preamp:Out"     input = "hpf:In"        }
                    { output = "hpf:Out"        input = "rnnoise:Input" }
                    { output = "rnnoise:Output" input = "eq_box:In"     }
                    { output = "eq_box:Out"     input = "eq_mud:In"     }
                    { output = "eq_mud:Out"     input = "eq_clarity:In" }
                    { output = "eq_clarity:Out" input = "eq_air:In"     }
                ]
            }
            audio.rate     = 48000
            audio.position = [ MONO ]
            capture.props  = {
                node.name           = "capture.clean_mic"
                node.passive        = true
                node.dont-reconnect = true
                target.object       = "alsa_input.usb-Focusrite_Scarlett_Solo_4th_Gen_S1CCK5M3C2A75F-00.HiFi__Mic2__source"
            }
            playback.props = {
                node.name        = "clean_mic"
                media.class      = "Audio/Source"
                priority.driver  = 1009
                priority.session = 1009
            }
        }
    }
]
