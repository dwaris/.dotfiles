context.modules = [
    {
        name  = libpipewire-module-filter-chain
        flags = [ nofail ]
        args  = {
            node.description = "Clean Microphone"
            media.name       = "Clean Microphone"
            filter.graph     = {
                nodes = [
                    {
                        type    = builtin
                        name    = hpf
                        label   = bq_highpass
                        control = {
                            "Freq" = 80.0
                            "Q"    = 0.707
                        }
                    }
                    {
                        type    = ladspa
                        name    = deepfilter
                        plugin  = libdeep_filter_ladspa
                        label   = deep_filter_mono
                        control = {
                            "Attenuation Limit (dB)"         = 40.0
                            "Min processing threshold (dB)"  = -10.0
                            "Min Processing Buffer (frames)" = 0.0
                            "Post Filter Beta"               = 0.02
                        }
                    }
                    {
                        type    = lv2
                        name    = gate
                        plugin  = "http://lsp-plug.in/plugins/lv2/gate_mono"
                        control = {
                            "enabled" = 1
                            "scm"     = 1        # RMS sidechain
                            "sla"     = 5.0      # 5 ms lookahead (preserves word starts)
                            "scr"     = 10.0     # 10 ms RMS reactivity
                            "shpm"    = 2        # 24 dB/oct sidechain HPF
                            "shpf"    = 120.0    # ignore low breath/desk rumble
                            "slpm"    = 1        # 12 dB/oct sidechain LPF
                            "slpf"    = 8000.0   # ignore high breath hiss/key ticks
                            "gh"      = 1        # hysteresis on
                            "gt"      = 0.01     # -40.0 dB open threshold
                            "gz"      = 0.501187 # -6.0 dB knee zone
                            "ht"      = 0.501187 # -6.0 dB hysteresis (closes at -46.0 dB)
                            "hz"      = 0.501187 # -6.0 dB hysteresis zone
                            "at"      = 5.0      # 5 ms attack
                            "hold"    = 150.0    # 150 ms hold
                            "rt"      = 150.0    # 150 ms release
                            "gr"      = 0.001    # -60.0 dB reduction when closed
                        }
                    }
                    { type = builtin name = eq_box     label = bq_peaking   control = { "Freq" = 220.0   "Q" = 0.7 "Gain" = -2.0 } }
                    { type = builtin name = eq_mud     label = bq_peaking   control = { "Freq" = 350.0   "Q" = 1.2 "Gain" = -2.0 } }
                    { type = builtin name = eq_clarity label = bq_peaking   control = { "Freq" = 3500.0  "Q" = 0.9 "Gain" = 2.0  } }
                    { type = builtin name = eq_air     label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.7 "Gain" = 1.5  } }
                    {
                        type    = lv2
                        name    = comp
                        plugin  = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                        control = {
                            "enabled" = 1
                            "cm"      = 0        # downward compression
                            "scm"     = 1        # RMS sidechain
                            "shpm"    = 1        # 12 dB/oct sidechain HPF
                            "shpf"    = 100.0    # avoid pumping on plosives
                            "al"      = 0.125893 # -18.0 dB threshold
                            "cr"      = 2.5      # 2.5:1 ratio
                            "kn"      = 0.501187 # -6.0 dB soft knee
                            "at"      = 10.0     # 10 ms attack
                            "rt"      = 120.0    # 120 ms release
                            "mk"      = 1.412538 # +3.0 dB makeup gain
                        }
                    }
                    {
                        type    = lv2
                        name    = limiter
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_mono"
                        control = {
                            "enabled" = 1
                            "mode"    = 0        # Herm Thin
                            "th"      = 0.891251 # -1.0 dBFS ceiling
                            "boost"   = 0        # no auto-boost
                            "alr"     = 1        # automatic level regulation on
                            "lk"      = 5.0      # 5 ms lookahead
                            "at"      = 5.0
                            "rt"      = 50.0
                            "ovs"     = 0        # no oversampling (low CPU)
                        }
                    }
                ]
                links = [
                    { output = "hpf:Out"              input = "deepfilter:Audio In" }
                    { output = "deepfilter:Audio Out" input = "gate:in"             }
                    { output = "gate:out"             input = "eq_box:In"           }
                    { output = "eq_box:Out"           input = "eq_mud:In"           }
                    { output = "eq_mud:Out"           input = "eq_clarity:In"       }
                    { output = "eq_clarity:Out"       input = "eq_air:In"           }
                    { output = "eq_air:Out"           input = "comp:in"             }
                    { output = "comp:out"             input = "limiter:in"          }
                ]
            }
            audio.rate     = 48000
            audio.position = [ MONO ]
            capture.props  = {
                node.name           = "capture.clean_mic"
                node.passive        = true
                node.dont-reconnect = true
                target.object       = "alsa_input.usb-Focusrite_Scarlett_Solo_4th_Gen_S1CCK5M3C2A75F-00.HiFi__Mic2__source"
            }
            playback.props = {
                node.name        = "clean_mic"
                media.class      = "Audio/Source"
                priority.driver  = 1009
                priority.session = 1009
            }
        }
    }
]
