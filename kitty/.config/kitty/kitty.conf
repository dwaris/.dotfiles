# ~/.config/kitty/kitty.conf

# Font
font_family      family="BlexMono Nerd Font" style=Text
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# Shell & Behavior
shell herdr
confirm_os_window_close 0

# Disable Kitty window splits (handled by Herdr)
enabled_layouts  stack
map ctrl+shift+enter no_op
map ctrl+enter       no_op
