# High quality profile (replaces deprecated gpu-hq)
profile=high-quality
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe

# Smooth playback & display sync
video-sync=display-resample
interpolation=yes
tscale=oversample

# Downscaling behavior
dscale=mitchell
correct-downscaling=yes
linear-downscaling=no

# General UX
save-position-on-quit=yes
keep-open=yes
autofit-larger=100%x100%

# Audio & Volume
volume=100
volume-max=150

# Track preferences & Subtitles
alang=jpn,jp,eng,en
slang=eng,en,enUS
sub-auto=fuzzy
demuxer-mkv-subtitle-preroll=yes
